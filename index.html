<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f17" />
    <meta name="description" content="Rotina — central de gerenciamento da sua rotina pessoal." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Rotina</title>
    <script>
      // Aplica o tema salvo antes da renderização para evitar "flash" de tema errado
      try {
        var raw = localStorage.getItem('rotina:v1');
        var theme = raw ? (JSON.parse(raw).state || {}).settings?.theme : null;
        if (theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
